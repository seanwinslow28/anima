    seconds: 2.5
    influence: 0.7
    prompt: "Starting with a sharp white-flash electric crack at the very first frame, then the loudest office alarm: a repeating two-tone electronic klaxon with a lower klaxon underneath, heavy bass, speaker distortion, a wall shelf rattling hard, a cable swinging and tapping the wall, 2 seconds, then cut dead to silence, no tail, no reverb. No voices, no music."

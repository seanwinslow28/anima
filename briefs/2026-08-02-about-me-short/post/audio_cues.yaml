# AUDIO CUES — the machine-readable copy of AUDIO-PROMPTS-v1.md (SFX + ElevenLabs music) and
# LYRIA-PROMPTS-2026-09-13.md (Lyria music). Edit the prompts HERE once the sheets are settled; the
# sheets are the reasoning, this file is what runs. seconds = window + tail. influence = prompt_influence
# (high for literal single-event cues, low for textures). loop = ElevenLabs loop flag.

eleven-sfx:
  # ── the alarm family ──────────────────────────────────────────────────────────
  - id: A1a
    name: ALARM #1 · CRT + two-tone klaxon
    seconds: 3.0
    influence: 0.6
    prompt: "An old CRT television clicking on with a soft electric thunk and a faint high whine, followed immediately by a small office alarm: a repeating two-tone electronic klaxon, mid-sized, urgent but not painful, about 2 seconds, slightly muffled as if from a wall-mounted TV speaker. No voices, no music, no sirens."
  - id: A1b
    name: ALARM #1 · cartoon awooga
    seconds: 3.0
    influence: 0.6
    prompt: "A vintage cartoon problem alarm: a brassy 'awooga'-style klaxon repeating three times, cartoonish and springy, with a tiny red-light buzz underneath, 2.5 seconds, mono, a little tinny. No voices, no music."
  - id: A1c
    name: ALARM #1 · tabletop bell + beeps
    seconds: 3.0
    influence: 0.6
    prompt: "A tabletop alarm bell hammering fast for two seconds, tinny and insistent, with a short electronic beep pattern layered on top, heard through a small TV speaker. No speech, no music."
  - id: A2a
    name: ALARM #2 · klaxon, bigger
    seconds: 4.0
    influence: 0.6
    prompt: "An old CRT television clicking on with a soft electric thunk, then a small office alarm: a repeating two-tone electronic klaxon from a wall-mounted TV speaker — louder, closer, with more bass, a second lower klaxon tone added underneath, a crackle of speaker distortion, and the rattle of a wall shelf and a loose cable shaking with it, 3.5 seconds. No voices, no music, no sirens."

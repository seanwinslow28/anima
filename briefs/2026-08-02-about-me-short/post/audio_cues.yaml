eleven-music:
  - id: M-A1
    name: brochure bed · lean
    seconds: 50
    prompt: "Instrumental. 1950s educational film library cue, light orchestral: pizzicato strings, clarinet and flute carrying a cheerful, orderly melody, brushed snare, a soft tuba on the downbeats, bright and brisk at about 120 BPM. Mono-era warmth, slight tape hiss, gently compressed. Pleasant and officious, like a public-information short about workplace tidiness. Loops cleanly. No vocals, no modern drums, no synths, no comedic sound effects, no swells."
  - id: M-A2
    name: brochure bed · woodwind
    seconds: 50
    prompt: "Instrumental. Mid-century instructional-short score: a bassoon and clarinet duet walking a tidy little tune over plucked double bass and a light woodblock, a muted trumpet answering now and then, major key, moderate tempo, cheerful and unhurried, recorded on an old optical soundtrack with a little warmth and hiss. Repeats in a loop. No vocals, no synthesizers, no percussion hits, no slapstick stingers."
  - id: M-A3
    name: brochure bed · busier (Movement 2)
    seconds: 36
    prompt: "Instrumental. 1950s cartoon-short underscore for a busy montage: quick pizzicato strings and xylophone runs, a chattering clarinet line, brushed drums with a walking bass, upbeat and bustling but still polite and orderly, about 132 BPM, vintage mono recording. No vocals, no drum fills, no mickey-mousing hits, no synths, no swells or big finishes."
  - id: M-B1
    name: pit-stop build · lean
    seconds: 13
    prompt: "Instrumental. 1950s cartoon-short action cue, 12 seconds: a fast, precise, rising figure on xylophone and pizzicato strings with a brisk snare roll underneath and a muted trumpet stabbing on each beat, building in quick steps, mechanical and cheerful like a well-oiled machine, then a clean hard stop on the final beat, no ring-out. Vintage mono. No vocals, no synths, no cymbal crash at the end, no fade."
  - id: M-B2
    name: pit-stop build · stopwatch
    seconds: 13
    prompt: "Instrumental. A short accelerating vintage orchestral build, about 12 seconds: woodwinds climbing a scale in tight sixteenth notes, timpani ticking like a stopwatch, brass entering in the last four seconds, tempo pushing forward, ending on a single clean stop. 1950s library recording, warm and hissy. No vocals, no crash cymbal, no reverb tail, no synths."
  - id: M-C1
    name: the settle · lean
    seconds: 9
    prompt: "Instrumental. A warm, brief 1950s orchestral resolution, 8 seconds: strings and a solo clarinet landing on a soft major chord, a gentle glockenspiel note, light and content, then settling to silence without a swell. Vintage mono recording. No vocals, no build, no cymbal, no big finish, no synths."
  - id: M-C2
    name: the settle · harp
    seconds: 9
    prompt: "Instrumental. 8 seconds of a mid-century film cue's happy ending in miniature: a small string section and a harp arpeggio resolving to a held soft chord, muted brass warming underneath, then fading naturally. Warm, modest, tidy. No vocals, no crescendo, no synths, no drums."
  - id: M-D1
    name: title sting (optional)
    seconds: 4
    prompt: "Instrumental. A 3-second 1950s cartoon title flourish: a quick ascending woodwind and xylophone figure ending on a bright brass chord, cheerful, vintage mono. No vocals, no synths, no drum hit, no reverb tail."


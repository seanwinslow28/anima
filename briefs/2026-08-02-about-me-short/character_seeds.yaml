- character_id: sean-anchor
  display_name: Sean
  story_role: 'Protagonist and narrator. The Full Stack PM, center frame: in the chaos
    in cycle 1 (thinking he''s conducting, egging the team on), then the swivel-away
    step-back — the film''s one quiet beat — and the steady conductor of the pit stop.
    Speaks exactly once on screen (the question to the user); his real recorded voice
    is the serene How-To narrator throughout.'
  style_register: pencil-test-colored
  source_notes: 'Existing registered character — reuse the sean-anchor Bible.

    New acting requirements for this piece:

    - The swivel: desk chair turned away from three monitors to face camera, eyes
    closed, deep breath, both palms pressed gently downward at chest height (the ''everybody
    settle'' gesture — small, bent elbows, nothing straight-armed; a raised-arm pose
    was explicitly retired for silhouette read-risk).

    - Cycle-1 ''egging them on'' energy vs. post-step-back conductor calm — same character,
    two tempos.

    - Scene anchor: briefs/2026-08-02-about-me-short/art-viz/route-c--gpt-ref.png
    (backup route-c--nb2.png).

    - Turnarounds on disk: runs/Act-Rework-Backlog/00_refs_normalized/sean-character-full-body-turnaround.png,
    runs/Act-Rework-Backlog/00_refs_normalized/sean-head-turnaround.png.'

- character_id: user
  display_name: The USER
  story_role: The reason the film exists. A faceless grey pencil-test humanoid in
    a t-shirt reading 'USER', small in the doorway, unnoticed through the chaos. Colorizes
    green — still faceless — at the exact moment Sean understands the real problem.
    Never a specific man or woman.
  style_register: pencil-test-colored
  source_notes: 'Design thesis, Sean verbatim: ''A user is almost always faceless
    unless it''s a close client or customer'' — understanding is what colorizes them.

    Two states: (1) GREY — unfinished, construction-lines placeholder person, the
    only fully colorless element in any frame; (2) GREEN — same figure, colorful (green
    lean), still faceless, beaming posture.

    The USER tee survives both states.

    No refs exist yet — art-department design pass to come; scene-scale reference
    in briefs/2026-08-02-about-me-short/art-viz/route-c--gpt-ref.png (doorway figure).'
  anchor_ref: null
  style_ref_ids: []
  cy_target_dir: characters/user/

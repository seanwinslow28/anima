<text x="862" y="370" font-family="Helvetica" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">S</text>
<text x="862" y="443" font-family="Helvetica" font-size="15" letter-spacing="1.5" text-anchor="middle" fill="#292929">SEAN&#8217;S STATION</text>
<text x="862" y="463" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#606060">desk, monitors, board &#183; bell and cannon to his right</text>
<text x="523" y="320" font-family="Helvetica" font-size="15" letter-spacing="1.5" text-anchor="middle" fill="#292929">CLAUDE &#183; NW CORNER</text>
<text x="523" y="339" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#606060">paper towers &#183; supply desk &#183; binders</text>
<text x="1166" y="320" font-family="Helvetica" font-size="15" letter-spacing="1.5" text-anchor="middle" fill="#292929">GROK &#183; NE CORNER</text>
<text x="1166" y="339" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#606060">darts in the WALL &#183; cans &#183; crates</text>
<text x="558" y="848" font-family="Helvetica" font-size="15" letter-spacing="1.5" text-anchor="middle" fill="#292929">CODEX &#183; SW CORNER</text>
<text x="558" y="867" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#606060">rack &#183; coffee counter &#183; cooler</text>
<text x="875" y="892" font-family="Helvetica" font-size="15" letter-spacing="1.5" text-anchor="middle" fill="#292929">GEMINI&#8217;S MOODBOARD</text>
<text x="875" y="911" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#606060">fifty taped concepts &#183; string lights &#183; worktable</text>
<text x="1227" y="636" font-family="Helvetica" font-size="15" letter-spacing="1.5" text-anchor="middle" fill="#292929">THE CRT</text>
<text x="1227" y="656" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="middle" fill="#606060">sill 6&#8242;6&#8243; above the credenza</text>
<text x="338" y="628" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="start" fill="#606060">DOORWAY &#8212; dressing only</text>
<text x="1377" y="416" font-family="Helvetica" font-size="12" letter-spacing="1.5" text-anchor="end" fill="#c0392b">M2 &#183; THE HOLE</text>
<text x="1377" y="434" font-family="Helvetica" font-size="11" letter-spacing="1.5" text-anchor="end" fill="#c0392b">beat 8 &#183; rocket leans out</text>

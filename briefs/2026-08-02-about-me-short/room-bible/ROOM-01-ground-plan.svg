<path d="M567 548L304 488L462 300Z" fill="#1f6f8b" fill-opacity="0.13" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7 5"/><circle cx="567" cy="548" r="13" fill="#1f6f8b"/><text x="567" y="553" font-family="Helvetica" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">03</text><text x="567" y="582" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="middle" fill="#1f6f8b">CLAUDE &#183; NW corner</text>
<path d="M585 680L338 720L408 504Z" fill="#1f6f8b" fill-opacity="0.13" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7 5"/><circle cx="585" cy="680" r="13" fill="#1f6f8b"/><text x="585" y="685" font-family="Helvetica" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">04</text><text x="585" y="714" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="middle" fill="#1f6f8b">CODEX &#183; SW corner</text>
<path d="M910 645L1033 908L770 899Z" fill="#1f6f8b" fill-opacity="0.13" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7 5"/><circle cx="910" cy="645" r="13" fill="#1f6f8b"/><text x="910" y="650" font-family="Helvetica" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">05</text><text x="910" y="679" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="middle" fill="#1f6f8b">GEMINI&#8217;S MOODBOARD</text>
<path d="M1122 557L1215 314L1373 490Z" fill="#1f6f8b" fill-opacity="0.13" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7 5"/><circle cx="1122" cy="557" r="13" fill="#1f6f8b"/><text x="1122" y="562" font-family="Helvetica" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">06</text><text x="1122" y="591" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="middle" fill="#1f6f8b">GROK &#183; NE corner</text>
<path d="M1095 751L1330 665L1316 868Z" fill="#1f6f8b" fill-opacity="0.13" stroke="#1f6f8b" stroke-width="1.5" stroke-dasharray="7 5"/><circle cx="1095" cy="751" r="13" fill="#1f6f8b"/><text x="1095" y="756" font-family="Helvetica" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">07</text><text x="1095" y="785" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="middle" fill="#1f6f8b">THE CRT ALARM</text>
<circle cx="1536" cy="280" r="42" fill="none" stroke="#606060" stroke-width="2"/>
<path d="M1536 310L1536 248" stroke="#292929" stroke-width="3"/>
<path d="M1536 240l-9 18h18Z" fill="#292929"/>
<text x="1536" y="228" font-family="Helvetica" font-size="18" font-weight="700" text-anchor="middle" fill="#292929">N</text>
<text x="1632" y="274" font-family="Helvetica" font-size="15" font-weight="400" text-anchor="start" fill="#606060">26 ft &#215; 18 ft</text>
<text x="1632" y="296" font-family="Helvetica" font-size="13" font-weight="400" text-anchor="start" fill="#606060">ceiling 10 ft &#183; 1 ft = 44 px</text>
<text x="1476" y="430" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="start" fill="#c0392b">EVERYONE GETS A CORNER</text>
<text x="1476" y="466" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#c0392b">Revision 2. Rev 1 still had Claude, Sean</text>
<text x="1476" y="489" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#c0392b">and Grok sharing the north wall &#8212; which</text>
<text x="1476" y="512" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#c0392b">is a LANE arrangement wearing a corner&#8217;s</text>
<text x="1476" y="535" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#c0392b">name, and lanes are what killed the cut</text>
<text x="1476" y="558" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#c0392b">all-corners wide.</text>
<text x="1476" y="581" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060"></text>
<text x="1476" y="604" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">Now Sean holds the north wall alone.</text>
<text x="1476" y="627" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">Claude wraps the NW corner off the west</text>
<text x="1476" y="650" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">wall; Grok wraps the NE corner off the</text>
<text x="1476" y="673" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">east wall. S03 and S06 become genuine</text>
<text x="1476" y="696" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">two-wall corner shots with real depth.</text>
<text x="1476" y="719" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060"></text>
<text x="1476" y="742" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">The doorway stays dressing. Sean asks the</text>
<text x="1476" y="765" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">question at his computer, not at a door,</text>
<text x="1476" y="788" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">so beats 2, 4, 12 and 13 all play at this</text>
<text x="1476" y="811" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">one station &#8212; and it is drawn to earn</text>
<text x="1476" y="834" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">that screen time.</text>
<text x="1476" y="857" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060"></text>
<text x="1476" y="880" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">RED = Movement 2. The hole, the code wall,</text>
<text x="1476" y="903" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">the bell and the cannon are all here from</text>
<text x="1476" y="926" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">the start so no later beat has to invent a</text>
<text x="1476" y="949" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">fixture the room never had.</text>
<text x="52" y="76" font-family="Helvetica" font-size="34" font-weight="700" text-anchor="start" fill="#292929">THE HQ &#183; SHEET 1 &#8212; GROUND PLAN</text>
<text x="52" y="106" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">The room bible, revision 2. One source of truth: this sheet and the elevations are drawn from the same table.</text>
<text x="52" y="130" font-family="Helvetica" font-size="16" font-weight="400" text-anchor="start" fill="#606060">Nothing moves between shots, and nothing appears in a later beat that is not on these sheets.</text>
<text x="52" y="1104" font-family="Helvetica" font-size="15" font-weight="700" text-anchor="start" fill="#292929">READ IT LIKE THIS</text>
<circle cx="62" cy="1130" r="11" fill="#1f6f8b"/>
<text x="82" y="1135" font-family="Helvetica" font-size="15" font-weight="400" text-anchor="start" fill="#606060">camera position; the dashed wedge is what that lens contains</text>
<rect x="52" y="1150" width="20" height="14" fill="#292929"/>
<text x="82" y="1163" font-family="Helvetica" font-size="15" font-weight="400" text-anchor="start" fill="#606060">solid = a fixture against a wall, drawn from above at its real depth</text>
<path d="M52 1184h20" stroke="#c0392b" stroke-width="3" stroke-dasharray="9 7"/>
<text x="82" y="1190" font-family="Helvetica" font-size="15" font-weight="400" text-anchor="start" fill="#c0392b">red = a Movement 2 addition, or a note to a human</text>
<text x="1848" y="1190" font-family="Helvetica" font-size="14" font-weight="400" text-anchor="end" fill="#606060">make_room_bible.py &#183; rev 2 &#183; 2026-08-31</text>
</svg>
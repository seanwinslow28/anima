- character_id: kid
  display_name: The Kid
  story_role: protagonist — smallest at the party, timid, unnamed on screen by design;
    transforms across the year (glasses = shed armor)
  style_register: primal-sketch-grit
  source_notes: 'DESIGN LOCKED (2026-07-14 sprint, Sean-ratified): pale skin, messy
    brown hair, thick square too-big glasses, chunky worn sneakers. Three states:
    wimpy (Act 1: glasses, no headband, shoulders in) -> mid-train -> trained (Act 3:
    fitted headband, no glasses, sleeves torn, dirt-smudged, sterner brow). Same body
    all states — posture + headband + gaze do the transformation, not growth. The
    glasses<->headband swap carries the whole arc. Headband: worn red, small PHOENIX
    stitched on it; too-big-swallowing-his-head at the start, fits by the return;
    visible in every training beat. Ratified anchors live in
    runs/2026-07-14-grandmaster-kid-design/Manually-Tinkered-Pass/ (gitignored) —
    ingest to source-refs/ at the Art Department pass. Act-1 competence plant: his
    hand snaps up and catches a flying object without looking (installed reflexes).'
  anchor_ref: null
  style_ref_ids: []
  cy_target_dir: characters/kid/
- character_id: grandma
  display_name: The Late Grandmother
  story_role: the engine — died weeks before Act 1; lived in the kid's house; never
    on-screen as a living character; present only through her room, the box, the
    taped-over VHS, one laugh, and two photographs
  style_register: primal-sketch-grit
  source_notes: 'DESIGN ADVANCED (2026-07-14 sprint): matches the boy''s family look —
    pale skin, silver-grey hair, warm lined face; unmistakably ONE woman across both
    artifact looks: (a) the warm framed photo with the kid; (b) the 1970s
    kung-fu-film-heroine flying-kick snapshot — young, fierce, HOLDING THE NINJA STAR
    (the same star the box''s second compartment holds; freeze-frame plant). Photo
    back carries her handwritten inscription: "The phoenix is born when it rises."
    (rise underlined) — decades old, written to herself, NEVER addressed to him.
    Home-movie look (third artifact surface): camcorder footage of her playing the
    disguised-training games with the little kid, boombox in frame. Her 1970s
    training footage shows THE SAME MOVES. VOICE RULES (hard): she never speaks a
    word anywhere; her laugh appears exactly once, inside the home-movie audio,
    degraded; NO ghost-beat/reflection/apparition in any form (cut 2026-07-18). She
    secretly trained him his whole life disguised as play; the reveal is evidence he
    finds himself; the year of training is entirely his own choice.'
  anchor_ref: null
  style_ref_ids: []
  cy_target_dir: characters/grandma/
- character_id: host-dad
  display_name: The Host Dad (the bully)
  story_role: antagonist — Brittany's father; runs the piñata ritual; the string is
    his weapon; muted (never punished beyond the disarm, never learns)
  style_register: primal-sketch-grit
  source_notes: 'CHARACTER REVISED 2026-07-18 (deliberate repeal of the 2026-07-02
    "benign dad / never mocked" rule — recorded in concept.md Decision Record #4).
    Design: a bigger, douchier MALE VERSION OF BRITTANY — family resemblance to the
    birthday girl is load-bearing. Douchey suburban alpha; hates weak people; puts
    them down and calls it a learning experience because that''s how he was raised
    (bible only, never screen time). Act 1: announces the turn order ("everyone gets
    a turn and a trophy nowadays"), calls the kid up first with the title line
    ("let''s give this little freak back there first licks"), tosses the stick to
    make him flinch, then yanks the string mid-swing — deliberately. The ONLY adult
    enjoying the humiliation (other adults wince). Act 3 disarm: expression sheets
    need the three-beat exit — muted speechlessness (over his shoulder as the geyser
    erupts, he''s facing the wrong way) -> pokes the star in the fence, one
    involuntary flash of respect at the kid -> shakes it off, "yea... whatever" body
    language. He learns nothing. NOT YET DESIGNED — Art Department queue.'
  anchor_ref: null
  style_ref_ids: []
  cy_target_dir: characters/host-dad/
- character_id: birthday-girl
  display_name: Brittany, the Birthday Girl
  story_role: the world-that-doesn't-change — sly bratty princess whose party (both
    years) stages the film; invited the kid as a setup; first into the candy mob,
    unchanged
  style_register: primal-sketch-grit
  source_notes: 'NEW SEED 2026-07-18. Angelica Pickles / Regina George species:
    raised a princess, expects the world to match; sly — acts friendly, sets people
    up to put them down for her own entertainment (the kid''s invitation was a
    setup). Visual family resemblance to BOTH parents (the dad is her bigger male
    version; the mom shares her look). Act-1 beats: princess-mugging for the
    camcorder; opening presents mid-party tossing cards unread; goes LAST at the
    piñata ("finishes the job"). Act 3: first into the geyser mob, still awful,
    zero change. Named ONLY by the end-card tape label ("BRITTANY''S 9th — DO NOT
    TAPE OVER"); no one speaks her name. NOT YET DESIGNED — Art Department queue.'
  anchor_ref: null
  style_ref_ids: []
  cy_target_dir: characters/birthday-girl/

# Eval suite for storytelling-architecture.
# Manual-review schema (input -> expected beat-map properties). Not wired to skill_optimizer.
# These test the SHAPE the skill produces, never prose (the skill emits beat maps, not sentences).
schema_version: 1

cases:
  - id: cold_open_not_throat_clearing
    input: "Build a beat map for a post about the night my nightly agent silently failed for a week and nobody noticed."
    expect:
      - "beat 1 is a cold open on a concrete moment, not context or 'In this post'"
      - "first beat raises one specific unanswered question"
      - "output is a beat map (step-outline), not prose sentences"

  - id: but_therefore_no_and_then
    input: "Beat map for: I switched my critic from API calls to subscription CLIs to cut cost; first attempt timed out nightly; root-caused it to MCP startup; fixed with a flag."
    expect:
      - "every adjacent beat connects with but or therefore"
      - "no beat connected by additive-only logic (and then / also / next)"
      - "the failed first attempt is its own escalating beat before the fix"

  - id: open_loop_closes
    input: "Beat map for a post that opens on a mysterious $40 cost spike and explains what caused it."
    expect:
      - "the cost-spike loop opened in beat 1 is explicitly closed by a later payoff beat"
      - "loop closes within ~1-3 beats (short form)"
      - "no loop left open at the end of the map"

  - id: withhold_the_rescue
    input: "Beat map for: the fix was a one-line flag, but I want the post to build tension before revealing it."
    expect:
      - "the one-line fix is NOT revealed in beat 1"
      - "tension escalates (progressive complication) before the payoff beat"
      - "the opening question outlives its introduction"

  - id: scaffold_as_form_not_formula
    input: "Beat map for a maker post using problem-struggle-fix; keep the template un-nameable."
    expect:
      - "uses problem-struggle-fix beat order"
      - "each beat carries a story-specific detail, not a generic placeholder"
      - "no canonical leak phrasing baked into beats (e.g. 'and that's when I realized')"
      - "beat order is bent enough that a reader could not name the template"

  - id: emits_beats_not_prose
    input: "Make this addictive: [a flat 200-word draft about adding evals to an agent]."
    expect:
      - "output is a beat map, not rewritten prose"
      - "does NOT phrase how any beat is worded"
      - "hands off to the voice layer for sentences (chain contract honored)"
